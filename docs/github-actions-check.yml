name: Plugin checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install locked dependencies
        run: npm ci --cache .cache/npm
      - name: Typecheck and build laboratory
        run: npm run build
      - name: Build actual DSH bundles
        run: npm run build:plugin
      - name: Unit and DOM regressions
        run: npm test
      - name: Desktop and mobile browser checks (never update goldens)
        run: npm run test:e2e
      - name: Dependency audit
        run: npm audit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 7
